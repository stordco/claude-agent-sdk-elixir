name: Docker Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual triggers for testing
  workflow_dispatch:

env:
  CLAUDE_AGENT_SDK_SKIP_VERSION_CHECK: "1"

jobs:
  docker-debian:
    name: Docker Test (Debian Bookworm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.test
          tags: claude-sdk-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run shell escaping tests in Docker
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test test/claude_agent/transport/subprocess_cli_test.exs --trace
          "

      - name: Run full test suite in Docker
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test --trace
          "

      - name: Verify script command availability
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            which script && \
            script --version
          "

      - name: Test Docker environment script
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            elixir test/support/docker_test_script.exs
          "

  docker-alpine:
    name: Docker Test (Alpine Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Alpine Dockerfile
        run: |
          cat > Dockerfile.alpine << 'EOF'
          FROM alpine:3.19

          # Install dependencies
          RUN apk add --no-cache \
              bash \
              curl \
              git \
              util-linux \
              nodejs \
              npm \
              erlang \
              elixir

          # Create non-root user
          RUN adduser -D -u 1000 app

          USER app
          WORKDIR /home/app

          # Copy SDK code
          COPY --chown=app:app . /home/app/claude-agent-sdk

          WORKDIR /home/app/claude-agent-sdk

          CMD ["/bin/bash"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alpine test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.alpine
          tags: claude-sdk-test-alpine:latest
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,mode=max,scope=alpine
          load: true

      - name: Run tests in Alpine
        run: |
          docker run --rm claude-sdk-test-alpine:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test test/claude_agent/transport/subprocess_cli_test.exs --trace
          "

      - name: Verify script command in Alpine
        run: |
          docker run --rm claude-sdk-test-alpine:latest which script

  docker-ubuntu:
    name: Docker Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Ubuntu Dockerfile
        run: |
          cat > Dockerfile.ubuntu << 'EOF'
          FROM ubuntu:22.04

          ENV DEBIAN_FRONTEND=noninteractive

          # Install dependencies
          RUN apt-get update && apt-get install -y \
              curl \
              git \
              util-linux \
              wget \
              gnupg \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          # Install Erlang and Elixir from Ubuntu repos (more reliable)
          RUN apt-get update && apt-get install -y \
              erlang \
              elixir \
              && rm -rf /var/lib/apt/lists/*

          # Create non-root user
          RUN useradd -m -u 1000 app

          USER app
          WORKDIR /home/app

          # Copy SDK code
          COPY --chown=app:app . /home/app/claude-agent-sdk

          WORKDIR /home/app/claude-agent-sdk

          CMD ["/bin/bash"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ubuntu
          tags: claude-sdk-test-ubuntu:latest
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,mode=max,scope=ubuntu
          load: true

      - name: Run tests in Ubuntu
        run: |
          docker run --rm claude-sdk-test-ubuntu:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test test/claude_agent/transport/subprocess_cli_test.exs --trace
          "

      - name: Verify script command in Ubuntu
        run: |
          docker run --rm claude-sdk-test-ubuntu:latest which script

  summary:
    name: Docker Tests Summary
    runs-on: ubuntu-latest
    needs: [docker-debian, docker-alpine, docker-ubuntu]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.docker-debian.result }}" != "success" ] || \
             [ "${{ needs.docker-alpine.result }}" != "success" ] || \
             [ "${{ needs.docker-ubuntu.result }}" != "success" ]; then
            echo "❌ Some Docker tests failed"
            exit 1
          else
            echo "✅ All Docker tests passed"
          fi
