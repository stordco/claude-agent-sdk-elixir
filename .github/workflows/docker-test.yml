name: Docker Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual triggers for testing
  workflow_dispatch:

env:
  CLAUDE_AGENT_SDK_SKIP_VERSION_CHECK: "1"

jobs:
  docker-test:
    name: Docker Test (Non-Interactive Linux Environment)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.test
          tags: claude-sdk-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run shell escaping tests in Docker
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test test/claude_agent/transport/subprocess_cli_test.exs --trace
          "

      - name: Run full test suite in Docker
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            mix deps.get && \
            mix test --trace
          "

      - name: Verify script command availability
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            which script && \
            script --version
          "

      - name: Test Docker environment script
        run: |
          docker run --rm claude-sdk-test:latest bash -c "
            cd /home/app/claude-agent-sdk && \
            elixir test/support/docker_test_script.exs
          "
